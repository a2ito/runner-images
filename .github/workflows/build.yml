name: build

# Dockerfile が壊れていないかを PR ごとに確かめる。ビルドするだけで push はしない
# （イメージは make build で Cloud Build から Artifact Registry に入れる）。
#
# public リポジトリなので GitHub-hosted で回す（分数に上限が無い）。
# runner-android は同じジョブで作った runner の上に積むため、2 つを 1 ジョブにまとめている。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: runner
        run: docker build -t runner:ci images/runner

      - name: runner-android
        run: docker build --build-arg RUNNER_IMAGE=runner:ci -t runner-android:ci images/runner-android
