name: build

# PR では Dockerfile が壊れていないかをビルドだけして確かめる。main では同じものを
# ghcr.io に push する（タグはコミットの SHA）。Cloud Run ジョブへの反映は make deploy。
#
# public リポジトリなので GitHub-hosted で回す（分数に上限が無い）。
# runner-android は同じジョブで作った runner の上に積むため、2 つを 1 ジョブにまとめている。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # main の push は途中で止めない。片方だけ push されたタグが残るため。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # パッケージをこのリポジトリに紐付ける。紐付いていないと、パッケージの権限が
      # リポジトリから引き継がれず、Actions から push し直せなくなる。
      - name: runner
        run: >-
          docker build
          --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          -t "$REGISTRY/runner:$GITHUB_SHA"
          images/runner

      - name: runner-android
        run: >-
          docker build
          --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          --build-arg "RUNNER_IMAGE=$REGISTRY/runner:$GITHUB_SHA"
          -t "$REGISTRY/runner-android:$GITHUB_SHA"
          images/runner-android

      # 自宅PC（wsl/）は :main を自動で取り込むので、push の前に中身が動くことを確かめる。
      # runner-android は runner に足したものなので、こちらだけで両方を見られる。
      # Runner.Listener が起動できれば、.NET が要るライブラリ（ICU、OpenSSL）もベースにある。
      - name: smoke test
        run: >-
          docker run --rm --entrypoint bash "$REGISTRY/runner-android:$GITHUB_SHA" -c '
          set -eux;
          ./bin/Runner.Listener --version;
          node --version; gh --version; aws --version; git --version; clang --version;
          python3 --version; make --version; g++ --version;
          test -x "$ANDROID_HOME/platform-tools/adb";
          test -x _work/_tool/flutter/stable-*-x64/flutter/bin/flutter'

      # SHA のタグは Cloud Run（make deploy）が、:main は自宅PC（wsl/）が使う。
      # runner-android:main を最後にするのは、自宅PCが pull するのはそれだけで、
      # その時点で全部が揃っているようにするため。
      - name: push
        if: github.event_name != 'pull_request'
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$REGISTRY/runner:$GITHUB_SHA"
          docker push "$REGISTRY/runner-android:$GITHUB_SHA"
          docker tag "$REGISTRY/runner:$GITHUB_SHA" "$REGISTRY/runner:main"
          docker tag "$REGISTRY/runner-android:$GITHUB_SHA" "$REGISTRY/runner-android:main"
          docker push "$REGISTRY/runner:main"
          docker push "$REGISTRY/runner-android:main"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
